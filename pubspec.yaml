name: funilar
description: Funilar - orçamentos, vistorias e sinistros para oficinas (Android, iPhone, Windows e Linux).
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  path_provider: ^2.1.4
  image_picker: ^1.1.2
  file_selector: ^1.0.3
  pdf: ^3.11.1
  # leitura de texto de PDF (importar orçamento da seguradora)
  syncfusion_flutter_pdf: '>=27.1.48 <40.0.0'
  printing: ^5.13.4
  http: ^1.2.2
  share_plus: ^10.1.4
  url_launcher: ^6.3.0
  cryptography: ^2.7.0
  crypto: ^3.0.3
  archive: any
  # 1.0 passou a exigir Swift Package Manager no iPhone e não compila; fica na última com CocoaPods
  google_mlkit_text_recognition: 0.17.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: any
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true
  assets:
    - assets/icon/logo_256.png

# Ícone do app (gerado no CI por tool/prepare_platforms.sh)
flutter_launcher_icons:
  image_path: assets/icon/icon.png
  android: true
  adaptive_icon_background: "#141C2B"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  ios: true
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/icon/icon.png
    icon_size: 256
